[package]
name = "tiffany-cli"
version = "0.1.13"
edition.workspace = true
license.workspace = true

[[bin]]
name = "tiffany-loop"
path = "src/main.rs"

[[bin]]
name = "tiffany"
path = "src/bin/tiffany.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
