name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      TIFFANY_RELEASE_ALLOW_FREQUENT: ${{ vars.TIFFANY_RELEASE_ALLOW_FREQUENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tiffany-release-preflight-${{ runner.os }}-workspace-crates-v1
          cache-workspace-crates: true
          workspaces: |
            . -> target
            tiffany-ui/codex-rs -> ../../target

      - name: Run preflight
        run: ./scripts/tiffany-release-preflight --quick --tag "${GITHUB_REF_NAME}"

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            native: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tiffany-release-${{ matrix.target }}-workspace-crates-v1
          cache-workspace-crates: true
          workspaces: |
            . -> target
            tiffany-ui/codex-rs -> ../../target

      - name: Verify native target
        if: ${{ matrix.native }}
        shell: bash
        run: |
          set -euo pipefail
          host="$(rustc -vV | awk '/^host:/ {print $2}')"
          if [[ "${host}" != "${{ matrix.target }}" ]]; then
            echo "::error::Runner host ${host} does not match release target ${{ matrix.target }}"
            exit 1
          fi

      - name: Build orchestrator
        shell: bash
        run: |
          set -euo pipefail
          cargo_args=(--profile tiffany-dist --locked --bin orchestrator)
          if [[ "${{ matrix.native }}" != "true" ]]; then
            cargo_args+=(--target "${{ matrix.target }}")
          fi
          started_at="$(date +%s)"
          cargo build "${cargo_args[@]}"
          finished_at="$(date +%s)"
          echo "orchestrator build took $((finished_at - started_at))s"

      - name: Build tiffany-loop UI
        shell: bash
        working-directory: tiffany-ui/codex-rs
        run: |
          set -euo pipefail
          cargo_args=(--profile tiffany-dist --locked -p tiffany-cli --bin tiffany-loop --bin tiffany)
          if [[ "${{ matrix.native }}" != "true" ]]; then
            cargo_args+=(--target "${{ matrix.target }}")
          fi
          started_at="$(date +%s)"
          cargo build "${cargo_args[@]}"
          finished_at="$(date +%s)"
          echo "tiffany-loop UI build took $((finished_at - started_at))s"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          name="tiffany-loop-${GITHUB_REF_NAME}-${{ matrix.target }}"
          staging="dist/${name}"
          binary_dir="target/tiffany-dist"
          expected_version="${GITHUB_REF_NAME#v}"
          if [[ "${{ matrix.native }}" != "true" ]]; then
            binary_dir="target/${{ matrix.target }}/tiffany-dist"
          fi
          mkdir -p "${staging}"

          assert_binary_version() {
            local binary="$1"
            local label
            label="$(basename "${binary}")"
            local output
            output="$("${binary}" --version)"
            local actual
            actual="$(awk '{print $2}' <<<"${output}")"
            if [[ "${actual}" != "${expected_version}" ]]; then
              echo "::error::${label} --version mismatch: expected ${expected_version}, got ${actual:-<empty>} (${output})"
              exit 1
            fi
            echo "${label} version ${actual}"
          }

          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            for binary in orchestrator.exe tiffany-loop.exe tiffany.exe; do
              if [[ ! -x "${binary_dir}/${binary}" ]]; then
                echo "::error::missing release binary ${binary_dir}/${binary}"
                ls -la "${binary_dir}" || true
                exit 1
              fi
            done
            cp "${binary_dir}/orchestrator.exe" "${staging}/"
            cp "${binary_dir}/tiffany-loop.exe" "${staging}/"
            cp "${binary_dir}/tiffany.exe" "${staging}/"
            if [[ "${{ matrix.native }}" == "true" ]]; then
              assert_binary_version "${staging}/orchestrator.exe"
              assert_binary_version "${staging}/tiffany-loop.exe"
              assert_binary_version "${staging}/tiffany.exe"
            fi
          else
            for binary in orchestrator tiffany-loop tiffany; do
              if [[ ! -x "${binary_dir}/${binary}" ]]; then
                echo "::error::missing release binary ${binary_dir}/${binary}"
                ls -la "${binary_dir}" || true
                exit 1
              fi
            done
            cp "${binary_dir}/orchestrator" "${staging}/"
            cp "${binary_dir}/tiffany-loop" "${staging}/"
            cp "${binary_dir}/tiffany" "${staging}/"
            if [[ "${{ matrix.native }}" == "true" ]]; then
              assert_binary_version "${staging}/orchestrator"
              assert_binary_version "${staging}/tiffany-loop"
              assert_binary_version "${staging}/tiffany"
            fi
            strip "${staging}/orchestrator" "${staging}/tiffany-loop" "${staging}/tiffany" || true
          fi

          cp README.md README.zh-CN.md CHANGELOG.md LICENSE THIRD_PARTY_NOTICES.md "${staging}/"

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path '${staging}' -DestinationPath 'dist/${name}.zip'"
          else
            tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tiffany-loop-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/tiffany-loop-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: publish
    env:
      HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'macguffinQ/homebrew-tap' }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check Homebrew tap token
        id: tap-token
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo "available=false" >> "${GITHUB_OUTPUT}"
            {
              echo "## Homebrew tap update skipped"
              echo
              echo "HOMEBREW_TAP_TOKEN is not configured, so this workflow published the GitHub Release but did not update \`${HOMEBREW_TAP_REPO}\`."
              echo
              echo "Configure a repository secret named \`HOMEBREW_TAP_TOKEN\` with write access to \`${HOMEBREW_TAP_REPO}\`, or update the tap manually with the commands in \`docs/homebrew.md\`."
              echo
              echo "\`\`\`bash"
              echo "git clone https://github.com/${HOMEBREW_TAP_REPO}.git ../homebrew-tap 2>/dev/null || true"
              echo "./scripts/tiffany-update-homebrew-tap --tag ${GITHUB_REF_NAME} --tap-dir ../homebrew-tap --commit --push"
              echo "\`\`\`"
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "::warning::HOMEBREW_TAP_TOKEN is not configured. GitHub Release publishing continues; update ${HOMEBREW_TAP_REPO} manually or add the secret for automatic tap updates."
          else
            echo "available=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Skip tap update
        if: ${{ steps.tap-token.outputs.available != 'true' }}
        run: echo "Skipping checkout because HOMEBREW_TAP_TOKEN is not configured."

      - name: Checkout tap
        if: ${{ steps.tap-token.outputs.available == 'true' }}
        uses: actions/checkout@v5
        with:
          repository: ${{ env.HOMEBREW_TAP_REPO }}
          token: ${{ env.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        if: ${{ steps.tap-token.outputs.available == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/tiffany-update-homebrew-tap \
            --tag "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --tap-dir homebrew-tap \
            --commit \
            --push
