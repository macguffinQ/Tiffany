name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tiffany-ui/codex-rs -> ../../target

      - name: Format
        run: |
          cargo fmt -- --check
          cargo fmt --manifest-path crates/tiffany-event-format/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: |
          cargo test --all
          cargo test --manifest-path crates/tiffany-event-format/Cargo.toml
          (cd tiffany-ui/codex-rs && cargo test -p codex-tui tiffany_orchestrator)
          (cd tiffany-ui/codex-rs && cargo test -p codex-tui slash_commands)
          (cd tiffany-ui/codex-rs && cargo test -p codex-tui update_action)
          (cd tiffany-ui/codex-rs && cargo test -p codex-tui tiffany_runtime_marker_disables_upstream_update_checks)
          ./scripts/tiffany-check-examples
          ./scripts/tiffany-check-homebrew-tap-helper

      - name: Build
        run: cargo build --all
