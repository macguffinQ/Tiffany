name: Tiffany Integration

on:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/tiffany-integration.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "scripts/tiffany-*"
      - "src/**"
      - "tiffany-ui/**"
  pull_request:
    paths:
      - ".github/workflows/tiffany-integration.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "scripts/tiffany-*"
      - "src/**"
      - "tiffany-ui/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "Check mode"
        type: choice
        required: true
        default: smoke
        options:
          - smoke
          - dist

jobs:
  tiffany:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      TIFFANY_CHECK_MODE: ${{ github.event.inputs.mode || 'smoke' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tiffany-ui/codex-rs -> ../../target

      - name: Tiffany integration
        run: ./scripts/tiffany-check "--${TIFFANY_CHECK_MODE}"
